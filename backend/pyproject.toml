[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vagexa"
version = "0.1.0"
description = "VAGEXA financial-crime investigation platform"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "argon2-cffi>=23.1",
  "fastapi>=0.115",
  "networkx>=3.4",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0.36",
  "structlog>=24.4",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28",
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/vagexa/api/routers/*" = ["B008"]

[tool.mypy]
python_version = "3.12"
packages = ["vagexa"]
mypy_path = "src"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "networkx.*"
ignore_missing_imports = true

[tool.alembic]
script_location = "alembic"
