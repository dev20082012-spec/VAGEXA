# Synthetic demonstration host. PostgreSQL and statement files live on the volume.
# The database is not published. Secrets are set with `fly secrets`, not in this file.

app = "vagexa-rj-demo"
primary_region = "sin"

[build]
  dockerfile = "deploy/Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "1m0s"
    method = "GET"
    path = "/health/ready"

[[mounts]]
  source = "vagexa_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
