# Optional. This machine may not have Docker. The checked-in local path uses PostgreSQL on port 5433.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vagexa
      POSTGRES_PASSWORD: vagexa-local-only
      POSTGRES_DB: vagexa
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - vagexa_pg:/var/lib/postgresql/data

volumes:
  vagexa_pg:
